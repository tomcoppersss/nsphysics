<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>NS physics simulation</title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">


    <!-- Style sheet for icons -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />



</head>

<body>


<script src="simulation.js" defer></script>
    



<div id="zIndex0" style="width: 100vw; height: 100vh;">
    
    <header style="background-color: #14151F; height: 10vh; width: 100%; margin: 0;">
    </header>



    <!-- Canvas + sidebars container -->

    <div style="display: flex; flex-direction: row; height: 90vh;">
        <br>


        <!-- Object creation sidebar -->

        <div id="objectCreation" style="background-color: #1E1F2B; width: 15%; overflow-x: auto;">
            <div style="height: 10%; background-color: #191A25;">Object creation</div>


            <div id="objectListContainer" style="height: 80%; max-height: 80%; overflow-y: scroll;">
                
                


            </div>



            <div id="newObjectButtonContainer" style="width: 100%; height: 10%; background-color: #191A25;">
            <button style="width: 90%; height: 80%; margin-left: 5%; margin-top: 2.5%;">+ New Object</button>
            </div>
        </div>



        
        <div id="canvasContainer" style="background-color: #1E1F2B; width: 70%; display: flex; flex-direction: column; justify-content: center; align-items: center;">

            <canvas id="canvas"></canvas>
            <div><p></p></div>
        </div>



        <div id="forceCreation" style="background-color: #1E1F2B; width: 15%; overflow-x: auto;">
            <div style="height: 10%; background-color: #191A25;">Force creation</div>


            <!-- Needs to be a scroll-box -->
            <div id="forceListContainer" style="height: 80%; max-height: 80%; overflow-y: scroll;">
                
            </div>

            <div id="newForceButtonContainer" style="width: 100%; height: 10%; background-color: #191A25;">
            <button style="width: 90%; height: 80%; margin-left: 5%; margin-top: 2.5%;">+ New Force</button>
            </div>
        </div>
    </div>


</div>

</body>


</html>
